<h2 class="text-2xl font-bold text-center mb-6">Register</h2>

<form
  [formGroup]="form"
  (ngSubmit)="register()"
  class="max-w-md mx-auto bg-white p-6 rounded-2xl shadow-md space-y-4"
>

  <input
    type="text"
    formControlName="name"
    placeholder="Name"
    class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500"
  />

  <input
    type="email"
    formControlName="email"
    placeholder="Email"
    class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500"
  />

  <input
    type="password"
    formControlName="password"
    placeholder="Password"
    class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500"
  />

  <button
    type="submit"
    [disabled]="form.invalid"
    class="w-full bg-green-600 text-white p-3 rounded-lg hover:bg-green-700 transition disabled:opacity-50"
  >
    Register
  </button>

  <p class="text-center text-sm">
    Already have an account?
    <a routerLink="/login" class="text-green-600 hover:underline font-medium">
      Login
    </a>
  </p>

</form>

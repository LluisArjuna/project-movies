<h2 class="text-2xl font-bold text-center mb-6">Login</h2>

<form
  [formGroup]="form"
  (ngSubmit)="login()"
  class="max-w-md mx-auto bg-white p-6 rounded-2xl shadow-md space-y-4"
>

  <input
    type="email"
    formControlName="email"
    placeholder="Email"
    class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
  />

  <input
    type="password"
    formControlName="password"
    placeholder="Password"
    class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
  />

  <button
    type="submit"
    [disabled]="form.invalid"
    class="w-full bg-blue-600 text-white p-3 rounded-lg hover:bg-blue-700 transition disabled:opacity-50"
  >
    Login
  </button>

  <p class="text-center text-sm">
    Don’t have an account?
    <a routerLink="/register" class="text-blue-600 hover:underline font-medium">
      Register
    </a>
  </p>

</form>

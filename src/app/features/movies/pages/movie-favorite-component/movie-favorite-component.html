<section class="max-w-8xl mx-auto px-4  py-8">
  <h2 class="text-2xl font-bold mb-6 text-gray-800">
    Your Favorite Movies
  </h2>

  @if (movies$ | async; as movies) {
    @if (movies.length === 0) {
      <article class="text-center py-10 bg-gray-50 rounded-xl border border-gray-200">
        <p class="text-gray-500 text-lg">
          No favorite movies yet. Start adding some!
        </p>
      </article>
    } @else {
      <article>
        <app-movie-grid [movies]="movies"></app-movie-grid>
      </article>
    }
  }
</section>

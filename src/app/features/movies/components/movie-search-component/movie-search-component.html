@let q = query();
<div class="relative max-w-xl mx-auto">
  <input type="text" placeholder="Search movies..." [value]="q" (input)="onInput($any($event.target).value)" class="w-full bg-gray-900 text-white placeholder-gray-400 rounded-full pl-10 pr-10 py-3 focus:outline-none focus:ring-2 focus:ring-yellow-400 transition"/>
  @if (q) {
    <button (click)="clear()" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-white transition">✖</button>
  }
</div>
